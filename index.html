<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>新南英語大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* 棋子動畫：平滑位移 */
        .character {
            transition: left 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: left;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .active-turn {
            animation: bounce 1s infinite;
            box-shadow: 0 0 16px 5px rgba(250, 204, 21, 0.8) !important;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* 骰子動畫 */
        @keyframes rollDice {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.2); }
            50% { transform: rotate(180deg) scale(0.85); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .rolling {
            animation: rollDice 0.6s ease-in-out;
        }

        /* 慶祝動畫 */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 跑道格子樣式 (優化二：格數清楚可數) */
        .track-cell {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            border-right: 1.5px solid rgba(203, 213, 225, 0.55);
            position: relative;
            padding-bottom: 3px;
        }
        .track-cell:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.65);
        }
        .track-cell:nth-child(odd) {
            background-color: rgba(241, 245, 249, 0.35);
        }
        .cell-num {
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            line-height: 1;
            user-select: none;
        }

        /* 浮水印形式 (完全依照 media_1790095389276.png 像素級打造) */
        .watermark-pill {
            position: fixed;
            bottom: 12px;
            left: 16px;
            background: #111827;
            border: 1.5px solid #374151;
            border-radius: 9999px;
            padding: 5px 16px;
            color: #f9fafb;
            font-size: 0.88rem;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            z-index: 80;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="min-h-[100dvh] w-full flex flex-col items-center justify-center text-gray-800">

    <!-- 1. 遊戲首頁 (完全依據 messageImage_1790095247546.jpg) -->

                    <input type="text" id="p1-name" value="Player 1" class="w-full px-4 py-3 border-2 border-red-300 rounded-xl focus:outline-none focus:border-red-500 text-lg text-red-600 font-bold">

    <div id="game-screen" class="hidden flex-col w-full h-[100dvh] max-w-7xl mx-auto p-2 md:p-6 gap-2 md:gap-4">
        
        <!-- 標題與狀態 -->
        <div class="flex justify-between items-center bg-white p-3 md:p-4 rounded-2xl shadow-md border-2 border-blue-200 flex-shrink-0">
            <h2 class="text-xl md:text-2xl font-black text-blue-600 hidden sm:block">新南英語大冒險</h2>
            <div class="text-center flex-grow">

            <button id="music-toggle" onclick="toggleMusic()" class="ml-2 bg-yellow-400 hover:bg-yellow-500 text-white w-10 h-10 md:w-12 md:h-12 rounded-full shadow-md text-xl md:text-2xl flex items-center justify-center transition-colors">

        <!-- 賽道區：外層大卡片 -->

                    <!-- 格子背景由 JS 動態生成 15 個明確格子 (優化二) -->
                    <div id="grid-p1" class="absolute inset-0 flex pr-10 md:pr-14 pointer-events-none"></div>
                    <!-- 棋子頭像 -->
                    <div id="p1-avatar" class="character w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 bg-red-500 rounded-full border-4 border-white shadow-md flex items-center justify-center text-white font-bold text-base md:text-xl z-20 absolute active-turn" style="left: 0.5%;">P1</div>

                    <div id="grid-p2" class="absolute inset-0 flex pr-10 md:pr-14 pointer-events-none"></div>
                    <div id="p2-avatar" class="character w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 bg-blue-500 rounded-full border-4 border-white shadow-md flex items-center justify-center text-white font-bold text-base md:text-xl z-20 absolute" style="left: 0.5%;">P2</div>
                    <div class="absolute right-12 md:right-16 text-blue-300 font-bold text-base md:text-lg pointer-events-none">Goal</div>

                <!-- Player 3 Track (綠隊跑道) -->

                    <div id="grid-p3" class="absolute inset-0 flex pr-10 md:pr-14 pointer-events-none"></div>
                    <div id="p3-avatar" class="character w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 bg-green-500 rounded-full border-4 border-white shadow-md flex items-center justify-center text-white font-bold text-base md:text-xl z-20 absolute" style="left: 0.5%;">P3</div>
                    <div class="absolute right-12 md:right-16 text-green-300 font-bold text-base md:text-lg pointer-events-none">Goal</div>

        </div>

        <!-- 互動控制區 -->
        <div class="bg-white p-3 md:p-4 rounded-2xl shadow-md border-2 border-gray-200 flex justify-center items-center gap-4 md:gap-6 flex-shrink-0">

    <!-- 3. 題目彈出視窗 (純文字選擇題，絕不在語音中唸出答案！) -->
    <div id="question-modal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl border-4 md:border-8 border-indigo-400 w-full max-w-3xl overflow-hidden pop-in flex flex-col max-h-[90dvh]">
            <div class="bg-indigo-500 text-white p-3 md:p-4 text-center flex-shrink-0">

    <!-- 4. 答題結果回饋視窗 -->

    <!-- 5. 遊戲結束視窗 -->
    <div id="winner-modal" class="hidden fixed inset-0 modal-overlay z-[70] flex items-center justify-center p-4">

            <h3 id="winner-name" class="text-3xl md:text-4xl font-bold text-gray-800 mb-8">Player Name</h3>
            <button onclick="location.reload()" class="bg-white text-yellow-600 font-black text-xl md:text-2xl py-4 px-8 rounded-2xl shadow-lg hover:bg-gray-100 transform transition active:scale-95 w-full">
                再玩一次 (Play Again)
            </button>
        </div>
    </div>

    <!-- 6. 浮水印標籤 (完全依照 media_1790095389276.png 像素級打造) -->
    <div class="watermark-pill">Created by 祐誠老師</div>

    <script>
        /* ========================================================
           音效與背景音樂設定 (專為 iPad Air 5 強化原生 Web Audio 解鎖)
           純合成音效與樂曲，絕不使用任何語音朗讀爆雷劇透答案！
           ======================================================== */
        /* ========================================================
           音效與背景音樂設定 (專為 iPad Air 5 / iOS WebKit 強化重構)
           1. HTML5 Audio 靜音音訊橋接：強制提升音訊類別至「Playback」(與 YouTube 相同)
              徹底克服 iPad 控制中心「靜音模式/小鈴鐺」靜音 Web Audio 的問題！
           2. 解決 Safari WebKit 指數曲線 (ExponentialRamp) 數值 0 拋錯問題
           3. 完善 AudioContext 非同步 resume 狀態切換
           ======================================================== */
        let audioCtx = null;
        let isMusicPlaying = false;
        let bgmInterval = null;
        let beatCount = 0;
        let audioUnlocked = false;
        let iosAudioBridge = null;

        // 0.1 秒極短 Base64 靜音 WAV 音訊
        const SILENT_WAV_BASE64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";

        // 強制提升 iOS 音訊權限至 Playback (與 YouTube、新聞影片同等級，無視靜音開關)
        function unlockIOSPlaybackCategory() {
            try {
                if (!iosAudioBridge) {
                    iosAudioBridge = new Audio(SILENT_WAV_BASE64);
                    iosAudioBridge.setAttribute('playsinline', '');
                    iosAudioBridge.setAttribute('webkit-playsinline', '');
                }
                iosAudioBridge.play().then(() => {
                    console.log("iOS Playback Audio Session Activated!");
                }).catch(() => {});
            } catch (e) {}
        }

        async function initAndUnlockAudio() {
            unlockIOSPlaybackCategory();
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) {
                        audioCtx = new AudioContextClass({ latencyHint: 'interactive' });
                    }
                }
                if (!audioCtx) return false;

                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                if (!audioUnlocked) {
                    const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const source = audioCtx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    if (source.start) source.start(0);
                    else if (source.noteOn) source.noteOn(0);
                    audioUnlocked = true;
                }
                return true;
            } catch (e) {
                console.warn("音效初始化失敗:", e);
                return false;
            }
        }

        // 全域觸控即時喚醒 (相容 LINE、Chrome、Safari)
        const globalUnlock = () => {
            initAndUnlockAudio();
        };
        document.addEventListener('touchstart', globalUnlock, { passive: true });
        document.addEventListener('touchend', globalUnlock, { passive: true });
        document.addEventListener('click', globalUnlock, { passive: true });

        // 原生音調合成 (全面採用 linearRampToValueAtTime 避免 Safari WebKit 拋錯)
        function playTone(freq, type, duration, vol = 0.15, startTime = 0) {
            if (!audioCtx) initAndUnlockAudio();
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            try {
                const now = audioCtx.currentTime;
                const start = now + startTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type || 'sine'; 
                osc.frequency.setValueAtTime(freq, start);
                
                // 起點設為 0.0001，避免 WebKit 指數或浮點數溢位
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.linearRampToValueAtTime(vol, start + 0.02); 
                gain.gain.linearRampToValueAtTime(0.0001, start + duration); 
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(start);
                osc.stop(start + duration + 0.05);
            } catch (e) {
                console.warn("playTone error:", e);
            }
        }

        async function toggleMusic() {
            await initAndUnlockAudio(); 
            const btn = document.getElementById('music-toggle');
            
            if (isMusicPlaying) {
                if (bgmInterval) clearInterval(bgmInterval);
                isMusicPlaying = false;
                btn.innerText = "🔇";
                btn.classList.replace("bg-yellow-400", "bg-gray-400");
                btn.classList.replace("hover:bg-yellow-500", "hover:bg-gray-500");
            } else {
                isMusicPlaying = true;
                btn.innerText = "🎵";
                btn.classList.replace("bg-gray-400", "bg-yellow-400");
                btn.classList.replace("hover:bg-gray-500", "hover:bg-yellow-500");
                
                const sequence = [
                    { note: 261.63, vol: 0.18 }, { note: 392.00, vol: 0.12 }, 
                    { note: 329.63, vol: 0.14 }, { note: 392.00, vol: 0.12 },
                    { note: 349.23, vol: 0.18 }, { note: 523.25, vol: 0.12 }, 
                    { note: 440.00, vol: 0.14 }, { note: 523.25, vol: 0.12 },
                    { note: 392.00, vol: 0.18 }, { note: 587.33, vol: 0.12 }, 
                    { note: 493.88, vol: 0.14 }, { note: 587.33, vol: 0.12 },
                    { note: 523.25, vol: 0.22 }, { note: null, vol: 0 },     
                    { note: 392.00, vol: 0.18 }, { note: null, vol: 0 }
                ];
                
                beatCount = 0;
                if (bgmInterval) clearInterval(bgmInterval);
                bgmInterval = setInterval(() => {
                    try {
                        if (!isMusicPlaying) return;
                        if (!audioCtx) return;
                        if (audioCtx.state === 'suspended') {
                            audioCtx.resume();
                            return;
                        }
                        
                        const step = sequence[beatCount % sequence.length];
                        if (step.note) {
                            playTone(step.note, 'sine', 0.26, step.vol);
                            playTone(step.note, 'triangle', 0.18, step.vol * 0.45); 
                        }
                        beatCount++;
                    } catch (e) {}
                }, 190); 
            }
        }

        function playSFX(type) {
            initAndUnlockAudio();
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            try {
                if (type === 'roll') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        playTone(freq, 'sine', 0.12, 0.14, i * 0.045);
                    });
                } else if (type === 'correct') {
                    playTone(783.99, 'sine', 0.16, 0.22, 0);     
                    playTone(1046.50, 'sine', 0.45, 0.28, 0.12);   
                } else if (type === 'step') {
                    playTone(587.33, 'sine', 0.08, 0.18);
                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(349.23, now); 
                    osc.frequency.linearRampToValueAtTime(174.61, now + 0.45); 
                    
                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(0.24, now + 0.04);
                    gain.gain.linearRampToValueAtTime(0.0001, now + 0.45);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'win') {
                    playTone(523.25, 'triangle', 0.15, 0.22, 0);
                    playTone(659.25, 'triangle', 0.15, 0.22, 0.15);
                    playTone(783.99, 'triangle', 0.15, 0.22, 0.3);
                    playTone(1046.50, 'triangle', 0.6, 0.35, 0.45);
                    playTone(783.99, 'triangle', 0.15, 0.22, 0.65);
                    playTone(1046.50, 'triangle', 0.8, 0.35, 0.85);
                }
            } catch(e) {}
        }

        /* ========================================================
           優化三：100 題完整內建題庫 (依據 題庫 資料夾範圍精確打造)
           ======================================================== */
        const questionBank = [
          {
                    "q": "哪一個單字的母音發音與 'tea' 相同？",
                    "options": [
                              "bee",
                              "bed",
                              "box"
                    ],
                    "ans": 0

            { id: 'p1', name: 'Player 1', pos: 0, color: 'text-red-500', bg: 'bg-red-500', border: 'border-red-500' },
            { id: 'p2', name: 'Player 2', pos: 0, color: 'text-blue-500', bg: 'bg-blue-500', border: 'border-blue-500' },
            { id: 'p3', name: 'Player 3', pos: 0, color: 'text-green-500', bg: 'bg-green-500', border: 'border-green-500' }
        ];
        let currentPlayerIndex = 0;
        let pendingDiceValue = 0;
        let currentQuestion = null;
        let availableQuestions = [...questionBank];

        // 渲染 15 個明確的格子標記 (優化二)
        function renderTrackGrids() {
            ['grid-p1', 'grid-p2', 'grid-p3'].forEach(gridId => {
                const container = document.getElementById(gridId);
                if (!container) return;
                container.replaceChildren();
                for (let i = 0; i < totalSteps; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'track-cell';
                    const span = document.createElement('span');
                    span.className = 'cell-num';
                    span.textContent = i + 1;
                    cell.appendChild(span);
                    container.appendChild(cell);
                }
            });
        }

        async function startGame() {
            try {
                await initAndUnlockAudio();
                if (!isMusicPlaying) {
                    toggleMusic();
                }
            } catch (e) {
                console.log("初始化音效失敗", e);
            }

            players[0].name = document.getElementById('p1-name').value.trim() || 'Player 1';
            players[1].name = document.getElementById('p2-name').value.trim() || 'Player 2';
            players[2].name = document.getElementById('p3-name').value.trim() || 'Player 3';

            document.getElementById('p1-avatar').innerText = players[0].name.substring(0, 2);
            document.getElementById('p2-avatar').innerText = players[1].name.substring(0, 2);
            document.getElementById('p3-avatar').innerText = players[2].name.substring(0, 2);

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            renderTrackGrids();
            updateTurnDisplay();
            players.forEach((_, idx) => updateAvatarPosition(idx));
        }

        function updateTurnDisplay() {
            const p = players[currentPlayerIndex];
            const display = document.getElementById('current-turn-display');
            display.innerText = p.name;
            display.className = `text-2xl md:text-3xl font-black ml-1 md:ml-2 ${p.color}`;

            players.forEach((player, index) => {
                const avatar = document.getElementById(`${player.id}-avatar`);
                if (index === currentPlayerIndex) {
                    avatar.classList.add('active-turn');
                } else {
                    avatar.classList.remove('active-turn');
                }
            });

            document.getElementById('dice-display').innerText = '?';
            const rollBtn = document.getElementById('roll-btn');
            rollBtn.disabled = false;
            rollBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function rollDiceAndPlay() {
            initAndUnlockAudio();
            const btn = document.getElementById('roll-btn');
            const diceDisplay = document.getElementById('dice-display');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            diceDisplay.classList.add('rolling');
            playSFX('roll'); 
            
            let count = 0;
            const rollInterval = setInterval(() => {
                diceDisplay.innerText = Math.floor(Math.random() * 3) + 1;
                count++;
                if (count > 10) {
                    clearInterval(rollInterval);
                    diceDisplay.classList.remove('rolling');
                    pendingDiceValue = Math.floor(Math.random() * 3) + 1; 
                    diceDisplay.innerText = pendingDiceValue;
                    
                    setTimeout(showQuestion, 800);
                }
            }, 50);
        }

        function showQuestion() {
            const p = players[currentPlayerIndex];
            
            if (availableQuestions.length === 0) {
                availableQuestions = [...questionBank];
            }
            const qIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions.splice(qIndex, 1)[0];

            document.getElementById('question-player-name').innerText = p.name;
            document.getElementById('pending-steps').innerText = pendingDiceValue;
            document.getElementById('question-text').innerText = currentQuestion.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.replaceChildren();
            
            currentQuestion.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 md:p-4 rounded-xl border-2 border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 text-lg md:text-xl font-bold text-gray-700 transition-colors shadow-sm active:bg-indigo-100";
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = () => checkAnswer(idx);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('question-modal').classList.remove('hidden');
        }

        function checkAnswer(selectedIndex) {
            initAndUnlockAudio();
            document.getElementById('question-modal').classList.add('hidden');
            const isCorrect = (selectedIndex === currentQuestion.ans);
            
            const feedbackModal = document.getElementById('feedback-modal');
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackMsg = document.getElementById('feedback-msg');

            feedbackModal.classList.remove('hidden');

            if (isCorrect) {
                playSFX('correct'); 
                feedbackBox.className = "bg-white p-8 rounded-3xl shadow-2xl text-center transform transition-transform pop-in border-4 border-green-500";
                feedbackIcon.innerText = "🌟";
                feedbackTitle.innerText = "答對了！ Awesome!";
                feedbackTitle.className = "text-4xl font-black mb-2 text-green-600";
                feedbackMsg.innerText = `準備前進 ${pendingDiceValue} 步！`;
                
                // 逐格動態前進 (優化二：清楚看到走幾格)
                stepByStepMove(currentPlayerIndex, pendingDiceValue);
            } else {
                playSFX('wrong'); 
                feedbackBox.className = "bg-white p-8 rounded-3xl shadow-2xl text-center transform transition-transform pop-in border-4 border-red-500";
                feedbackIcon.innerText = "Oops!";
                feedbackTitle.innerText = "答錯囉！ Try Again";
                feedbackTitle.className = "text-4xl font-black mb-2 text-red-600";
                feedbackMsg.textContent = "不要灰心！留在原地。";
                const ansSpan = document.createElement("span");
                ansSpan.className = "text-sm mt-2 block text-gray-500";
                ansSpan.textContent = "正確答案是: " + correctText;
                feedbackMsg.appendChild(document.createElement("br"));
                feedbackMsg.appendChild(ansSpan);
            }
        }

        // 依據格數精確定位棋子 (優化二)
        function updateAvatarPosition(playerIdx) {
            const p = players[playerIdx];
            const avatar = document.getElementById(`${p.id}-avatar`);
            if (!avatar) return;

            if (p.pos === 0) {
                avatar.style.left = '4px';
            } else {
                // 每格寬度為 (100% - 54px)/15，棋子精確對齊該格中心
                const stepPercent = (p.pos / totalSteps) * 88;
                avatar.style.left = `calc(4px + ${stepPercent}%)`;
            }
        }

        // 逐格跳步前進動畫，每走一步發出聲音，清楚看到走幾格 (優化二)
        function stepByStepMove(playerIdx, steps) {
            const p = players[playerIdx];
            const targetPos = Math.min(totalSteps, p.pos + steps);
            
            const stepInterval = setInterval(() => {
                if (p.pos < targetPos) {
                    p.pos++;
                    updateAvatarPosition(playerIdx);
                    playSFX('step');
                } else {
                    clearInterval(stepInterval);
                }
            }, 240);
        }

        function closeFeedback() {
            document.getElementById('feedback-modal').classList.add('hidden');
            
            if (players[currentPlayerIndex].pos >= totalSteps) {
                showWinner(players[currentPlayerIndex]);
                return;
            }

            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            updateTurnDisplay();
        }

        function showWinner(player) {
            playSFX('win'); 
            document.getElementById('winner-modal').classList.remove('hidden');
            document.getElementById('winner-name').innerText = player.name;
        }
    </script>
</body>
</html>
